name: Amapiano
options:
  bundleIdPrefix: com.djsly
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.4.13
    CURRENT_PROJECT_VERSION: 1
targets:
  Amapiano:
    type: application
    platform: iOS
    sources:
      - path: Amapiano
        excludes:
          - "**/*.xcodeproj"
    dependencies:
      - target: AmapianoWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.amapiano
      INFOPLIST_FILE: Amapiano/Resources/Info.plist
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: Amapiano/Resources/Info.plist
      properties:
        CFBundleName: Amapiano
        CFBundleDisplayName: Amapiano
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: "Amapiano needs local network access to connect to your music server."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            tail40af16.ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSBonjourServices:
          - _http._tcp
        UIBackgroundModes:
          - audio

  AmapianoWatch:
    type: application
    platform: watchOS
    sources:
      - AmapianoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djsly.amapiano.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AmapianoWatch/Info.plist
      properties:
        CFBundleDisplayName: Amapiano
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.djsly.amapiano
